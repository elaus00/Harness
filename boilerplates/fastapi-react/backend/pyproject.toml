[project]
name = "harness-api"
version = "0.1.0"
description = "FastAPI starter for Harness projects"
requires-python = ">=3.12,<3.14"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.115,<1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
