<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시험 작업 공간</title>
<link rel="stylesheet" href="/assets/style.css">
<body>
<main>
  <header><p>Harness</p><h1>작업 공간</h1><p id="health" role="status">연결 확인 중</p></header>
  <p id="message" role="status" aria-live="polite"></p>
  <section id="auth" hidden>
    <h2>로그인</h2>
    <form id="login"><label>계정 <input name="username" autocomplete="username" required></label>
      <label>비밀번호 <input name="password" type="password" autocomplete="current-password" required></label>
      <button>로그인</button></form>
    <p id="identity"></p><button id="logout" type="button" hidden>로그아웃</button>
  </section>
  <section id="workflow" hidden>
    <h2>데이터셋</h2>
    <p>CSV 구문 검사만 제공합니다. 열의 의미와 도메인 규칙은 과제에 맞춰 확인하세요.</p>
    <label>CSV 파일 <input id="files" type="file" accept=".csv" multiple></label>
    <button id="validate" type="button">구문 확인</button>
    <button id="apply" type="button">새 버전 적용</button>
    <pre id="datasets" tabindex="0"></pre>
    <h2>생성</h2>
    <label>과제 설정(JSON) <textarea id="options" rows="4" spellcheck="false">{}</textarea></label>
    <button id="generate" type="button">생성·검증</button>
    <button id="refresh" type="button">작업 새로고침</button>
    <p>현장 생성기와 독립 검증기를 구현한 뒤 사용할 수 있습니다.</p>
    <ul id="jobs"></ul>
    <h2>결과</h2>
    <label>내보내기 내용 <textarea id="export" rows="12" readonly></textarea></label>
    <button id="copy" type="button">내용 복사</button>
    <button id="save" type="button" disabled>서버에 저장</button>
  </section>
  <p id="empty" hidden>기본 연결이 준비됐습니다. 화면과 기능은 현장 요구사항에 맞춰 구성하세요.</p>
</main>
<script src="/assets/app.js" defer></script>
</body>
</html>
